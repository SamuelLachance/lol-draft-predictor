<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoL Esports Predictor — Worlds 2026</title>
<meta name="description" content="Prédictions, ratings et analyse de draft pour les Worlds 2026 de League of Legends — page dédiée par match, mise à jour en direct.">
<link rel="stylesheet" href="common.css">
</head>
<body data-base=""><div class="wrap">
<header>
  <div class="logo">LP</div>
  <div><h1>LoL Esports Predictor</h1><div class="sub" id="sub">…</div></div>
  <div class="spacer"></div>
  <a class="tab" href="draft/" style="text-decoration:none;line-height:1.1" id="draftLink"></a>
  <span id="hbtn"></span>
</header>

<div class="cards" id="cards"></div>
<nav class="tabs" id="tabs"></nav>
<div id="view"></div>
<footer id="foot"></footer>
</div>

<script src="common.js"></script>
<script>
const {$,el,esc,pct,t,tx}=LP;
const ROLES=['top','jng','mid','bot','sup'];
const RN={top:'Top',jng:'Jungle',mid:'Mid',bot:'Bot',sup:'Support'};
const state={teams:[],players:[],champions:[],matches:[],meta:{},regions:[],pool:[],worlds:null,dv:null,es:[],esAt:0,
  view:'worlds',tLeague:'ALL',pRole:'mid',cRole:'ALL',cSrc:'worlds',wFilter:'up'};
const ea=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const TABS=()=>[['worlds','Worlds 2026'],['picks',t('Résultats vs modèle','Results vs model')],['teams',t('Équipes','Teams')],
  ['players',t('Joueurs','Players')],['champions','Meta / Champions'],['predict',t('Simuler un match','Predict a match')]];

async function boot(){
  const get=f=>LP.json(f).catch(()=>f==='meta'?{}:[]);
  [state.teams,state.players,state.champions,state.matches,state.meta,state.regions,state.pool]=await Promise.all(
    ['teams','players','champions','matches','meta','regions','champ_pool'].map(get));
  state.worlds=await LP.json('worlds',true).catch(()=>null);
  fetch('model/draft_v2.json').then(r=>r.json()).then(d=>state.dv=d).catch(()=>{});
  buildIndexes();
  shell(); cards(); render();
  document.body.addEventListener('click',e=>{
    const pl=e.target.closest('[data-player]'),tm=e.target.closest('[data-team]');
    if(pl)openCard({type:'player',name:pl.dataset.player,role:pl.dataset.role});
    else if(tm)openCard({type:'team',name:tm.dataset.team});
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  document.addEventListener('lp:lang',()=>{shell();cards();render()});
  if(location.hash.startsWith('#tab=')){const v=location.hash.slice(5);if(TABS().some(x=>x[0]===v)){state.view=v;shell();render()}}
  poll(); setInterval(poll,30000); setInterval(tickStatus,15000);
}
function shell(){
  $('#hbtn').innerHTML='';$('#hbtn').append(LP.langBtn(),' ',LP.themeBtn());
  $('#draftLink').textContent='🎯 Draft Assistant';
  const tabs=$('#tabs');tabs.innerHTML='';
  TABS().forEach(([k,l])=>{const b=el('button','tab'+(k===state.view?' on':''),l);b.dataset.v=k;
    b.onclick=()=>{state.view=k;history.replaceState(null,'','#tab='+k);[...tabs.children].forEach(x=>x.classList.toggle('on',x===b));render()};tabs.append(b)});
  $('#foot').innerHTML=t(
    `Modèle : force d'équipe inter-ligues (Bradley-Terry à décalage de ligue) + TrueSkill des rosters + valeur de draft, validé en <i>walk-forward</i> (refit mensuel, aucune fuite). La draft seule explique très peu un match pro ; elle ajuste la proba, elle ne la détermine pas. Données : Leaguepedia, Oracle's Elixir, API lolesports. Analyse esport, pas un conseil de pari.`,
    `Model: inter-league team strength (league-offset Bradley-Terry) + roster TrueSkill + draft value, validated <i>walk-forward</i> (monthly refits, no leakage). Draft alone explains very little of a pro game; it nudges the probability, it doesn't set it. Data: Leaguepedia, Oracle's Elixir, lolesports API. Esports analysis, not betting advice.`);
}
function buildIndexes(){
  state.modalStack=[];
  state.tidx=Object.fromEntries(state.teams.map(x=>[x.team,x]));
  state.pidx={};state.players.forEach(p=>state.pidx[p.player+'|'+p.role]=p);
  state.regidx=Object.fromEntries((state.regions||[]).map(r=>[r.region,r]));
  state.roleStats={};
  ROLES.forEach(ro=>{
    const ps=state.players.filter(p=>p.role===ro),col=f=>ps.map(f).filter(v=>v!=null).sort((a,b)=>a-b);
    state.roleStats[ro]={gd15:col(p=>p.gd15),kp:col(p=>p.kp),kda:col(p=>p.kda),dmg:col(p=>p.dmg||0)};
  });
}
function cards(){
  const m=state.meta,w=state.worlds,mm=(m.metrics||{})['bt+ts+draft']||{},old=(m.metrics||{}).elo_seq_ancien||{};
  const c=$('#cards');c.innerHTML='';
  const data=[[t('Données jusqu\'au','Data through'),(m.data_through||m.updated)+(m.n_games?` <small>${m.n_games.toLocaleString()} games</small>`:'')],
    [t('Précision walk-forward','Walk-forward accuracy'),pct(mm.acc,1)+` <small>${t('vs ancien','vs old')} ${pct(old.acc,1)}</small>`],
    [t('Log-loss','Log-loss'),(mm.logloss||'–')+` <small>${t('ancien','old')} ${old.logloss||'–'}</small>`],
    [t('Équipes majeures','Major teams'),m.n_teams],[t('Joueurs','Players'),m.n_players]];
  data.forEach(([k,v])=>{const d=el('div','card');d.append(el('div','k',k),el('div','v',v));c.append(d)});
  $('#sub').innerHTML=`<span class="livedot off" id="dot"></span><span id="stat"></span>`;tickStatus();
}
function tickStatus(){
  const s=$('#stat');if(!s)return;const w=state.worlds,live=(state.es||[]).filter(e=>e.state==='inProgress').length;
  const dot=$('#dot');if(dot){dot.className='livedot'+(live?' hot':(state.esAt&&Date.now()-state.esAt<120000?'':' off'))}
  s.textContent=(live?`🔴 ${live} ${t('match en direct','live match(es)')} · `:'')+
    t('Modèle recalculé','Model rebuilt')+' '+(w?LP.ago(Date.parse(w.generated)):'–')+' · '+t('flux live','live feed')+' '+(state.esAt?LP.ago(state.esAt):'–');
}
async function poll(){
  try{state.es=await LP.esSchedule();state.esAt=Date.now()}catch(e){}
  try{const l=await LP.json('live',true);
    if(!state.worlds||l.version!==state.worlds.generated){state.worlds=await LP.json('worlds',true)}}catch(e){}
  tickStatus();if(state.view==='worlds'&&!$('#modal')?.style.display.includes('grid'))render();
}
const panel=(title,extra)=>{const p=el('div','panel');const h=el('div','phead');h.append(el('h3',null,title));if(extra)h.append(extra);p.append(h);return p};
const filterBar=(opts,cur,on)=>{const w=el('div');w.style.cssText='display:flex;gap:6px;flex-wrap:wrap';
  opts.forEach(([k,l])=>{const b=el('button','filt'+(k===cur?' on':''),l);b.onclick=()=>on(k);w.append(b)});return w};
function render(){
  const v=$('#view');v.innerHTML='';
  const f={worlds:worldsView,picks,teams,players,champions:champs,predict}[state.view];
  v.append(f());LP.hydrate(v);
}
function tableEl(head,rows){const s=el('div','scroll'),tb=el('table');
  tb.innerHTML='<thead><tr>'+head.map(h=>`<th class="${h[1]||''}">${h[0]}</th>`).join('')+'</tr></thead>';
  const b=el('tbody');rows.forEach(r=>b.append(r));tb.append(b);s.append(tb);return s}

// ============ WORLDS ============
function evFor(m){const ev=LP.findEvent(m,state.es||[]);if(!ev)return null;
  const names=ev.match.teams.map(x=>x.name.toLowerCase().replace(/[^a-z0-9]/g,''));
  const n1=(m.t1||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const flip=n1&&names[1]&&names[1].startsWith(n1.slice(0,4))&&!(names[0]&&names[0].startsWith(n1.slice(0,4)));
  const w=ev.match.teams.map(x=>x.result?x.result.gameWins:null);
  return {state:ev.state,s1:flip?w[1]:w[0],s2:flip?w[0]:w[1],id:ev.match.id,ev}}
function matchCard(m){
  const o=evFor(m),st=o?o.state:(m.status==='completed'?'completed':'unstarted');
  const started=st!=='unstarted';
  const s1=started?(o&&o.s1!=null?o.s1:m.s1):null,s2=started?(o&&o.s2!=null?o.s2:m.s2):null;
  const done=st==='completed',live=st==='inProgress';
  const a=el('a','mc');a.href='match/#'+(m.slug||'');
  const ts=LP.utc(m.date);
  const chip=live?`<span class="chip live">● LIVE</span>`:done?`<span class="chip done">${t('Terminé','Final')}</span>`:`<span class="chip up">${LP.fmtTime(ts)}</span>`;
  const known=m.t1&&m.t2;
  const w1=done&&Number(s1)>Number(s2),w2=done&&Number(s2)>Number(s1);
  const p=m.pred?m.pred.series:null;
  a.innerHTML=`<div class="top"><span>${esc(m.stage==='Play-In'?'Play-In':'Swiss')} · ${esc(m.round||'')}</span><span>Bo${m.bo}</span><span style="margin-left:auto">${chip}</span></div>
    <div class="tr ${w2?'lose':''}"><span>${known?esc(m.t1):t('À déterminer','TBD')}</span><span class="sc">${s1==null?'':s1}</span></div>
    <div class="tr ${w1?'lose':''}"><span>${known?esc(m.t2):t('À déterminer','TBD')}</span><span class="sc">${s2==null?'':s2}</span></div>
    ${p!=null?`<div class="pb"><span style="width:${p*100}%"></span></div><div class="ft"><span>${pct(p)}</span><span>${t('victoire (série)','series win')}</span><span>${pct(1-p)}</span></div>`:''}
    ${m.stakes?`<div class="ft"><span>${t('Qualif.','Qualif.')} ${pct(m.stakes.qual_now.a)}</span><span>${m.stakes.records.a} · ${m.stakes.records.b}</span><span>${pct(m.stakes.qual_now.b)}</span></div>`:''}`;
  return a;
}
function worldsView(){
  const W=state.worlds,wrap=el('div');
  if(!W){wrap.append(el('div','err',t('Données Worlds indisponibles pour le moment.','Worlds data unavailable right now.')));return wrap}
  const me=W.matches.filter(m=>m.stage==='Main Event'),all=W.matches;
  const bar=filterBar([['up',t('À venir / en direct','Upcoming / live')],['done',t('Terminés','Completed')],['all',t('Tous','All')]],state.wFilter,k=>{state.wFilter=k;render()});
  const p=panel(t('Matchs — cliquez pour la page dédiée','Matches — click for the dedicated page'),bar);
  const stOf=m=>{const o=evFor(m);return o?o.state:(m.status==='completed'?'completed':'unstarted')};
  let list=all.filter(m=>state.wFilter==='all'||(state.wFilter==='done'?stOf(m)==='completed':stOf(m)!=='completed'));
  if(state.wFilter==='done')list=list.slice().reverse();
  let hidden=0;if(state.wFilter==='up'){const k=list.filter(m=>m.t1&&m.t2||stOf(m)!=='unstarted');hidden=list.length-k.length;list=k}
  list=list.slice(0,state.wFilter==='all'?60:36);
  let cur='';const grid=[];let g=null;
  list.forEach(m=>{const d=LP.fmtDay(LP.utc(m.date));
    if(d!==cur){cur=d;p.append(el('div','day',d));g=el('div','mgrid');p.append(g)}
    g.append(matchCard(m))});
  if(!list.length)p.append(el('div','note',t('Aucun match dans cette vue.','No match in this view.')));
  if(hidden)p.append(el('div','note',t(`${hidden} matchs suivants (équipes à déterminer) apparaîtront automatiquement dès que les affiches seront connues — voir « Tous ».`,`${hidden} later matches (teams TBD) will appear automatically once the pairings are set — see “All”.`)));
  wrap.append(p);
  // classement Swiss
  const sp=panel(t('Swiss Stage — classement et chances de qualification','Swiss Stage — standings & qualification odds'));
  const rows=W.standings.map((s,i)=>{const tr=el('tr'),q=s.w>=3,out=s.l>=3;
    const top=Object.entries(s.rec||{}).slice(0,2).map(([k,v])=>`${k} ${pct(v)}`).join(' · ');
    tr.innerHTML=`<td class="rk">${i+1}</td><td><b class="lnk" data-team="${ea(s.team)}">${esc(s.team)}</b><span class="tag">${esc(s.region||'')}</span></td>
      <td class="num"><b>${s.w}-${s.l}</b></td>
      <td><div class="qbar"><div class="bar"><span style="width:${(s.qual||0)*100}%;background:${q?'var(--fav)':out?'var(--bad)':'var(--accent)'}"></span></div><b>${q?'✔':out?'✘':pct(s.qual)}</b></div></td>
      <td class="num">${pct(s.title,1)}</td><td class="muted" style="font-size:11px">${top}</td>`;return tr});
  sp.append(tableEl([['#','rk'],[t('Équipe','Team')],[t('Bilan','Record'),'num'],[t('Qualif. top 8','Top-8')],[t('Titre','Title'),'num'],[t('Bilans probables','Likely records')]],rows));
  sp.append(el('div','note',tx(W.sim.note)+' · '+t('Probabilités tirées de','Probabilities from')+' '+W.sim.n.toLocaleString()+' '+t('simulations, ratings du','simulations, ratings as of')+' '+W.data_through+(W.rating_adjusted_games?` (+${W.rating_adjusted_games} ${t('games Worlds intégrées','Worlds games folded in')})`:'')+'.'));
  wrap.append(sp);
  // meta du tournoi
  const M=W.meta_worlds.n>=6?W.meta_worlds:W.meta_recent;
  const mp=panel(t('Champions les plus contestés','Most contested champions')+' — '+M.since+` (${M.n} games)`);
  mp.append(champTable(M.rows.slice(0,12)));wrap.append(mp);
  return wrap;
}
function champTable(rows,predN){
  const dvmap={};state.champions.forEach(c=>dvmap[c.champion+'|'+c.role]=c.dv);
  return tableEl([['#','rk'],[t('Champion','Champion')],[t('Rôle','Role')],[t('Présence','Presence'),'num'],['Picks','num'],['Bans','num'],['Win%','num'],
    [t('Prévu prochains matchs','Forecast next matches'),'num'],[t('Valeur draft','Draft value'),'num']],
    rows.map((r,i)=>{const tr=el('tr'),dv=r.dv!=null?r.dv:dvmap[r.champion+'|'+r.role];
      tr.innerHTML=`<td class="rk">${i+1}</td><td>${LP.champ(r.champion)}</td><td>${r.role?`<span class="tag">${r.role.toUpperCase()}</span>`:''}</td>
        <td class="num"><b>${pct(r.pres)}</b></td><td class="num">${r.picks}</td><td class="num">${r.bans}</td>
        <td class="num ${r.wr!=null?(r.wr>=.5?'ok':'no'):''}">${r.wr!=null&&r.picks>=3?pct(r.wr):'–'}</td>
        <td class="num">${r.pred!=null?'<b>'+pct(r.pred)+'</b>':'–'}</td>
        <td class="num muted">${dv!=null?(dv>=0?'+':'')+dv.toFixed(2):'–'}</td>`;return tr}));
}

// ============ onglets existants ============
function picks(){
  const p=panel(t('Résultats récents vs prédictions du modèle (avant draft, hors-échantillon)','Recent results vs model (pre-draft, out-of-sample)'));
  const rows=state.matches.slice(0,120).map(m=>{
    const tr=el('tr'),ok=(m.pred>=.5)===(m.blue_win===1);
    const fav=m.pred>=.5?m.blue:m.red, fp=m.pred>=.5?m.pred:1-m.pred;
    tr.innerHTML=`<td class="muted">${m.date}</td>
      <td><b class="lnk" data-team="${ea(m.blue)}">${esc(m.blue)}</b> <span class="muted">vs</span> <span class="lnk" data-team="${ea(m.red)}">${esc(m.red)}</span></td>
      <td><span class="lnk" data-team="${ea(fav)}">${esc(fav)}</span> <span class="chip fav">${pct(fp)}</span></td>
      <td>${m.blue_win?'<b>'+esc(m.blue)+'</b>':'<b>'+esc(m.red)+'</b>'}</td>
      <td class="${ok?'ok':'no'}">${ok?'✓':'✗'}</td>`;return tr});
  p.append(tableEl([['Date'],[t('Match','Match')],[t('Pick du modèle','Model pick')],[t('Vainqueur','Winner')],[t('Réussi','Hit')]],rows));return p;
}
function teams(){
  const regs=['ALL',...state.regions.map(r=>r.region)];
  const bar=filterBar(regs.map(l=>[l,l==='ALL'?t('Toutes','All'):l]),state.tLeague,k=>{state.tLeague=k;render()});
  const wrap=el('div');
  if(state.regions.length){const rb=el('div');rb.style.cssText='display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px;align-items:center';
    rb.append(el('span','muted',t('Force des ligues (décalage appris sur les matchs inter-ligues) :','League strength (offset learned from inter-league games):')));
    state.regions.forEach(r=>{const c=el('span','chip');c.style.cssText='background:var(--sunk);border:1px solid var(--line2);color:var(--ink);padding:4px 9px';
      c.innerHTML=`<b>${r.region}</b> <span class="elo">${r.rating}</span>`;rb.append(c)});wrap.append(rb)}
  const p=panel(t('Classement — Elo calibré par ligue (ligues majeures actives uniquement)','Ranking — league-calibrated Elo (active major leagues only)'),bar);
  const list=state.teams.filter(x=>state.tLeague==='ALL'||x.region===state.tLeague);
  const rows=list.map((x,i)=>{const tr=el('tr');
    tr.innerHTML=`<td class="rk">${i+1}</td><td><b class="lnk" data-team="${ea(x.team)}">${esc(x.team)}</b><span class="tag">${esc(x.league)}</span></td>
      <td class="elo num">${x.power}</td><td class="num muted">${x.lg_off>=0?'+':''}${x.lg_off}</td><td class="num muted">${x.dev>=0?'+':''}${x.dev}</td>
      <td class="num">${x.ts_mu!=null?x.ts_mu:'–'}</td><td class="num">${x.form}</td><td class="num">${x.wins}-${x.losses}</td><td class="num">${pct(x.wr)}</td>`;return tr});
  p.append(tableEl([['#','rk'],[t('Équipe','Team')],['Power','num'],[t('Ligue','League'),'num'],[t('Écart équipe','Team dev'),'num'],['Roster TS','num'],['L10','num'],[t('Bilan','Record'),'num'],['Win%','num']],rows));
  p.append(el('div','note',t('Power = niveau de la ligue + écart de l\'équipe dans sa ligue. Une équipe de division inférieure ne peut plus passer devant une équipe de ligue majeure : seules les ligues majeures actives sont classées.','Power = league level + team deviation inside the league. A lower-division team can no longer outrank a major-league team: only active major leagues are ranked.')));
  wrap.append(p);return wrap;
}
function players(){
  const roles=ROLES.map(r=>[r,RN[r]]);
  const bar=filterBar(roles,state.pRole,k=>{state.pRole=k;render()});
  const p=panel(t('Joueurs — performance individuelle + contexte d\'équipe','Players — individual performance + team context'),bar);
  const list=state.players.filter(x=>x.role===state.pRole).slice(0,60);
  const rows=list.map((x,i)=>{const tr=el('tr');
    tr.innerHTML=`<td class="rk">${i+1}</td><td><b class="lnk" data-player="${ea(x.player)}" data-role="${x.role}">${esc(x.player)}</b> <span class="muted lnk" data-team="${ea(x.team)}">${esc(x.team)}</span><span class="tag">${esc(x.league)}</span></td>
      <td class="rtg num">${x.rating.toFixed(1)}</td><td class="num muted">${x.team_pw}</td><td class="num">${pct(x.wr)}</td>
      <td class="num">${pct(x.kp)}</td><td class="num">${x.kda}</td>`;return tr});
  p.append(tableEl([['#','rk'],[t('Joueur','Player')],['Rating','num'],[t('Équipe','Team'),'num'],['Win%','num'],['KP','num'],['KDA','num']],rows));return p;
}
function champs(){
  const wrap=el('div');
  const W=state.worlds;
  const srcs=[['worlds','Worlds 2026'],['recent',t('60 derniers jours','Last 60 days')],['rating',t('Notes par rôle','Role ratings')]];
  const bar=filterBar(srcs,state.cSrc,k=>{state.cSrc=k;render()});
  if(state.cSrc==='rating'){
    const roles=[['ALL',t('Tous','All')],...ROLES.map(r=>[r,RN[r]])];
    const b2=filterBar(roles,state.cRole,k=>{state.cRole=k;render()});
    const p=panel(t('Valeur de draft ajustée par rôle (modèle v2) + TrueSkill','Adjusted draft value by role (model v2) + TrueSkill'),b2);
    const list=state.champions.filter(x=>state.cRole==='ALL'||x.role===state.cRole).slice(0,60);
    p.append(tableEl([['#','rk'],['Champion'],[t('Rôle','Role')],[t('Valeur draft','Draft value'),'num'],['TrueSkill','num'],['Win%','num'],['Games','num'],['GD@15','num']],
      list.map((x,i)=>{const tr=el('tr');tr.innerHTML=`<td class="rk">${i+1}</td><td>${LP.champ(x.champion)}</td><td><span class="tag">${x.role.toUpperCase()}</span></td>
        <td class="rtg num">${x.dv>=0?'+':''}${x.dv.toFixed(2)}</td><td class="num">${x.ts.toFixed(1)}</td><td class="num">${pct(x.wr)}</td><td class="num">${x.games}</td><td class="num">${x.gd15>0?'+':''}${x.gd15}</td>`;return tr})));
    p.append(el('div','note',t('Valeur de draft = effet du champion dans ce rôle sur la probabilité de victoire (logit), à force d\'équipe égale, estimé avec décroissance temporelle (la meta change vite).','Draft value = the champion\'s effect in that role on win probability (logit), holding team strength equal, estimated with time decay (the meta moves fast).')));
    wrap.append(p);return wrap;
  }
  if(!W){wrap.append(el('div','err','–'));return wrap}
  const M=state.cSrc==='worlds'?W.meta_worlds:W.meta_recent;
  const p=panel(`${t('Meta','Meta')} — ${M.since} (${M.n} games)`,bar);
  p.append(champTable(M.rows.slice(0,60)));
  p.append(el('div','note',t(`Présence = % des games où le champion est pick ou ban. « Prévu » = probabilité moyenne que le modèle lui donne d'apparaître dans un game des ${M.pred_matches||0} prochains matchs connus.`,`Presence = % of games where the champion is picked or banned. “Forecast” = the model's average probability that it appears in a game of the ${M.pred_matches||0} next known matches.`)));
  wrap.append(p);return wrap;
}
function predict(){
  const p=panel(t('Simuler un match — force d\'équipe × rosters × draft','Predict a matchup — team strength × rosters × draft'));
  const teamsL=[...state.teams].sort((a,b)=>a.team.localeCompare(b.team));
  const TM=state.tidx,BL=(state.meta.blend||{}),PRE=BL.pre||{w0:0,bt:1,ts_logit:0},POST=BL.post||PRE;
  const erf=x=>{const tt=1/(1+0.3275911*Math.abs(x));const yy=1-(((((1.061405429*tt-1.453152027)*tt+1.421413741)*tt-0.284496736)*tt+0.254829592)*tt)*Math.exp(-x*x);return x>=0?yy:-yy};
  const sig=z=>1/(1+Math.exp(-z));
  const pool=(state.pool&&state.pool.length?state.pool:[]).map(c=>c.champion).sort((a,b)=>a.localeCompare(b));
  const wrap=el('div');wrap.style.padding='16px';
  const selA=el('select'),selB=el('select'),selBo=el('select');selBo.style.minWidth='90px';
  teamsL.forEach(x=>{selA.append(new Option(`${x.team} (${x.power})`,x.team));selB.append(new Option(`${x.team} (${x.power})`,x.team))});
  const dflt=(n,fb)=>{const i=teamsL.findIndex(x=>x.team===n);return i>=0?i:fb};
  selA.selectedIndex=dflt('Gen.G',0);selB.selectedIndex=dflt('T1',1);
  [1,3,5].forEach(n=>selBo.append(new Option('Bo'+n,n)));selBo.value=3;
  const row=el('div');row.style.cssText='display:flex;gap:12px;flex-wrap:wrap;align-items:center';
  row.append(selA,el('span','muted','vs'),selB,selBo);
  const out=el('div');
  const draftToggle=el('button','filt',t('＋ Ajouter les drafts (optionnel)','＋ Add drafts (optional)'));draftToggle.style.marginTop='12px';
  const draftBox=el('div');draftBox.style.cssText='display:none;margin-top:12px';
  const picks={blue:{},red:{}};
  const champSel=(side,role)=>{const s=el('select');s.style.minWidth='140px';s.append(new Option('— '+RN[role]+' —',''));
    pool.forEach(c=>s.append(new Option(c,c)));s.onchange=()=>{picks[side][role]=s.value;go()};return s};
  const grid=el('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:18px';
  ['blue','red'].forEach(side=>{const col=el('div');col.append(el('div','sec',side==='blue'?t('Draft de A (côté bleu)','A draft (blue side)'):t('Draft de B (côté rouge)','B draft (red side)')));
    ROLES.forEach(role=>{const r=el('div');r.style.margin='6px 0';r.append(champSel(side,role));col.append(r)});grid.append(col)});
  draftBox.append(grid);
  draftToggle.onclick=()=>{const open=draftBox.style.display==='none';draftBox.style.display=open?'block':'none'};
  const SYN=[['top','jng'],['jng','mid'],['mid','bot'],['bot','sup'],['jng','sup'],['mid','sup'],['jng','bot']];
  function draftEdge(){const dv=state.dv;if(!dv)return null;const B=ROLES.map(r=>picks.blue[r]),R=ROLES.map(r=>picks.red[r]);
    if(B.filter(Boolean).length<5||R.filter(Boolean).length<5)return null;let e=0;
    ROLES.forEach((r,i)=>{const a=B[i],b=R[i];e+=dv.c[r+'|'+a]||0;e-=dv.c[r+'|'+b]||0;const lo=a<=b?a:b,hi=a<=b?b:a;e+=(a===lo?1:-1)*(dv.m[r+'|'+lo+'|'+hi]||0)});
    SYN.forEach(([r1,r2])=>{const i=ROLES.indexOf(r1),j=ROLES.indexOf(r2);e+=dv.s[r1+'|'+r2+'|'+B[i]+'|'+B[j]]||0;e-=dv.s[r1+'|'+r2+'|'+R[i]+'|'+R[j]]||0});return e}
  function go(){
    const a=selA.value,b=selB.value,bo=+selBo.value,TA=TM[a],TB=TM[b];if(!TA||!TB||a===b){out.innerHTML='';return}
    const BETA=25/6;let tl=0;
    if(TA.ts_mu!=null&&TB.ts_mu!=null){const mu=TA.ts_mu-TB.ts_mu,s2=TA.ts_sig**2+TB.ts_sig**2+10*BETA*BETA;let tp=.5*(1+erf(mu/Math.sqrt(2*s2)));tp=Math.min(.999,Math.max(.001,tp));tl=Math.log(tp/(1-tp))}
    const d=TA.bt-TB.bt,side=BL.bt_side||0;
    const pB=sig(PRE.w0+PRE.bt*(d+side)+PRE.ts_logit*tl),pR=1-sig(PRE.w0+PRE.bt*(-d+side)+PRE.ts_logit*-tl);
    let pg=(pB+pR)/2,note=t('Aucune draft saisie : proba avant draft (moyenne des deux côtés).','No draft entered: pre-draft probability (average of both sides).');
    const de=draftEdge();
    if(de!=null){pg=sig(POST.w0+POST.bt*(d+side)+POST.ts_logit*tl+POST.draft*de);note=t('Avec draft : ','With draft: ')+t('A côté bleu · avantage de draft ','A on blue · draft edge ')+(de>=0?'+':'')+de.toFixed(2)+' logit'}
    const need=Math.floor(bo/2)+1,q=1-pg;let ps=0;for(let k=0;k<need;k++){let c=1;for(let i=0;i<k;i++)c=c*(need-1+k-i)/(i+1);ps+=c*Math.pow(pg,need)*Math.pow(q,k)}
    out.innerHTML=`<div class="pred">
      <div class="side"><div class="nm">${esc(a)}</div><div class="el">Power ${TA.power} · ${TA.region}</div><div class="wpbig" style="color:var(--fav)">${pct(ps)}</div></div>
      <div class="muted">Bo${bo}<br>${t('série','series')}</div>
      <div class="side"><div class="nm">${esc(b)}</div><div class="el">Power ${TB.power} · ${TB.region}</div><div class="wpbig" style="color:var(--bad)">${pct(1-ps)}</div></div></div>
      <div class="wpbar"><span style="width:${ps*100}%"></span></div>
      <div class="muted" style="padding:2px 18px 4px">${t('Un game','Single game')} : ${pct(pg,1)} / ${pct(1-pg,1)} — ${note}</div>`;
  }
  selA.onchange=go;selB.onchange=go;selBo.onchange=go;wrap.append(row,draftToggle,draftBox,out);p.append(wrap);go();return p;
}

// ============ fiches (clic sur un joueur / une équipe) ============
function pctileOf(role,stat,v){const a=(state.roleStats[role]||{})[stat];if(!a||!a.length||v==null)return .5;let lo=0;for(const x of a)if(x<v)lo++;return lo/a.length}
const barColor=p=>p>=.6?'var(--fav)':p>=.35?'var(--warn)':'var(--bad)';
function segRow(lbl,val,frac,color){const r=el('div','brow');
  r.innerHTML=`<span class="lbl">${lbl}</span><span class="val" style="color:${color}">${val}</span>`;
  const bar=el('div','bar'),sp=el('span');sp.style.width=Math.max(2,Math.min(100,frac*100))+'%';sp.style.background=color;
  bar.append(sp);r.append(bar);return r}
function miniTiles(pairs){const w=el('div','mini');pairs.forEach(([k,v])=>{const d=el('div','t');d.innerHTML=`<div class="k">${k}</div><div class="v">${v}</div>`;w.append(d)});return w}
function closeModal(){const m=$('#modal');if(m)m.style.display='none';state.modalStack=[]}
function openCard(ref,push){
  if(push!==false)state.modalStack.push(ref);
  let m=$('#modal');
  if(!m){m=el('div','modal-bg');m.id='modal';document.body.append(m);m.addEventListener('click',e=>{if(e.target===m)closeModal()})}
  m.innerHTML='';const sheet=el('div','sheet');
  sheet.append(ref.type==='player'?playerCard(ref.name,ref.role):teamCard(ref.name));
  m.append(sheet);m.style.display='grid';m.scrollTop=0;LP.hydrate(m);
}
function backBtn(){const b=el('button','mx','‹');b.onclick=()=>{state.modalStack.pop();const prev=state.modalStack[state.modalStack.length-1];prev?openCard(prev,false):closeModal()};return b}
function closeX(){const b=el('button','mx','✕');b.style.marginLeft='auto';b.onclick=closeModal;return b}
function mtable(head,rows){const mt=el('div','mt');mt.append(tableEl(head,rows));return mt}
function playerCard(name,role){
  const p=state.pidx[name+'|'+role],wrap=el('div');
  if(!p){wrap.append(el('div','mhead',`<h2>${esc(name)}</h2>`),el('div','mbody',t('Pas de données détaillées.','No detailed data.')));return wrap}
  const h=el('div','mhead');if(state.modalStack.length>1)h.append(backBtn());
  h.append(el('h2',null,esc(p.player)),el('span','tag',role.toUpperCase()));
  const tl=el('span','tag lnk');tl.dataset.team=p.team;tl.textContent=p.team;h.append(tl);
  h.append(el('span','tag',p.league),closeX());
  const b=el('div','mbody');
  b.append(el('div',null,`<div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Rating</div><div class="rtg" style="font-size:30px">${p.rating.toFixed(1)}</div>`));
  b.append(el('div','sec',t('Construction du rating','How the rating is built')));
  const mag=Math.max(Math.abs(p.c_ind),Math.abs(p.c_team),8);
  b.append(segRow(t('Individuel','Individual'),(p.c_ind>=0?'+':'')+p.c_ind.toFixed(1),Math.abs(p.c_ind)/mag,p.c_ind>=0?'var(--gold)':'var(--bad)'));
  b.append(segRow(t('Contexte équipe','Team context'),(p.c_team>=0?'+':'')+p.c_team.toFixed(1),Math.abs(p.c_team)/mag,p.c_team>=0?'var(--accent)':'var(--bad)'));
  b.append(miniTiles([['Winrate',pct(p.wr)],[t('Bilan','Record'),`${p.wins}-${p.losses}`],['KP',pct(p.kp)],['KDA',p.kda]]));
  b.append(el('div','sec',t('vs pairs du rôle (percentile)','vs role peers (percentile)')));
  [['GD@15','gd15',p.gd15],['Dmg share','dmg',p.dmg],['KP','kp',p.kp],['KDA','kda',p.kda]].forEach(([lbl,s,v])=>{
    const pc=pctileOf(role,s,v),disp=s==='gd15'?((v>0?'+':'')+v):(s==='dmg'||s==='kp')?pct(v):v;
    b.append(segRow(lbl,disp,pc,barColor(pc)));});
  if(p.champs&&p.champs.length){b.append(el('div','sec',t('Pool de champions','Champion pool')));
    b.append(mtable([['Champion'],['G','num'],['WR','num'],['KDA','num']],
      p.champs.map(c=>{const tr=el('tr');tr.innerHTML=`<td>${LP.champ(c.champion)}</td><td class="num">${c.games}</td><td class="num">${pct(c.wr)}</td><td class="num">${c.kda}</td>`;return tr})));}
  if(p.recent&&p.recent.length){b.append(el('div','sec',t('Dernières games','Recent games')));
    b.append(mtable([['Date'],['Champion'],['R'],['K/D/A','num'],['GD@15','num'],['vs']],
      p.recent.map(g=>{const tr=el('tr');tr.innerHTML=`<td class="muted">${g.date}</td><td>${LP.champ(g.champion)}</td><td class="${g.win?'ok':'no'}">${g.win?'W':'L'}</td><td class="num">${g.k}/${g.d}/${g.a}</td><td class="num">${g.gd15>0?'+':''}${g.gd15}</td><td><span class="lnk" data-team="${ea(g.opp)}">${esc(g.opp)}</span></td>`;return tr})));}
  wrap.append(h,b);return wrap;
}
function teamCard(name){
  const x=state.tidx[name],wrap=el('div');
  if(!x){wrap.append(el('div','mhead',`<h2>${esc(name)}</h2>`),el('div','mbody',t('Équipe hors des ligues majeures actives : pas de fiche.','Team outside the active major leagues: no card.')));return wrap}
  const h=el('div','mhead');if(state.modalStack.length>1)h.append(backBtn());
  h.append(el('h2',null,esc(x.team)),el('span','tag',x.league),el('span','tag',x.region),el('span','muted',`${x.wins}-${x.losses} · ${pct(x.wr)}`),closeX());
  const b=el('div','mbody');
  b.append(miniTiles([['Power',x.power],['Raw Elo',x.elo],['Roster TS',x.ts_mu!=null?x.ts_mu:'–'],['L10',x.form]]));
  b.append(el('div','sec',t('Power = niveau de la ligue + écart de l\'équipe','Power = league level + team deviation')));
  b.append(el('div','muted',`<span style="font-size:11px">${x.region} ${(state.regidx[x.region]||{}).rating||''} (${x.lg_off>=0?'+':''}${x.lg_off}) ${x.dev>=0?'+':'−'} ${Math.abs(x.dev)} = <b style="color:var(--gold)">${x.power}</b></span>`));
  const W=state.worlds,pr=W&&W.profiles&&W.profiles[x.team];
  if(pr&&pr.bullets&&pr.bullets.length){b.append(el('div','sec',t('Identité de jeu','Playstyle')));
    b.append(el('ul','bul',pr.bullets.map(u=>`<li>${esc(tx(u.t))}</li>`).join('')))}
  if(x.roster&&x.roster.length){b.append(el('div','sec',t('Roster','Roster')));
    b.append(mtable([['Role'],[t('Joueur','Player')],['Rating','num'],['KP','num'],['KDA','num']],
      x.roster.map(m=>{const pp=state.pidx[m.player+'|'+m.role],tr=el('tr');
        tr.innerHTML=`<td><span class="tag">${m.role.toUpperCase()}</span></td><td><b class="lnk" data-player="${ea(m.player)}" data-role="${m.role}">${esc(m.player)}</b></td><td class="rtg num">${pp?pp.rating.toFixed(1):'–'}</td><td class="num">${pp?pct(pp.kp):'–'}</td><td class="num">${pp?pp.kda:'–'}</td>`;return tr})));}
  if(x.matches&&x.matches.length){b.append(el('div','sec',t('Derniers matchs (pick du modèle vs résultat)','Recent matches (model pick vs result)')));
    b.append(mtable([['Date'],[t('Match','Match')],[t('Modèle','Model')],[t('Rés.','Res')],[t('OK','Hit')]],
      x.matches.map(m=>{const tr=el('tr'),ok=(m.pred>=.5)===(m.win===1);
        tr.innerHTML=`<td class="muted">${m.date}</td><td><span class="lnk" data-team="${ea(m.opp)}">${esc(m.opp)}</span> <span class="muted" style="font-size:10px">(${m.side})</span></td><td><span class="chip fav">${pct(m.pred)}</span></td><td class="${m.win?'ok':'no'}">${m.win?'W':'L'}</td><td class="${ok?'ok':'no'}">${ok?'✓':'✗'}</td>`;return tr})));}
  wrap.append(h,b);return wrap;
}
boot();
</script>
