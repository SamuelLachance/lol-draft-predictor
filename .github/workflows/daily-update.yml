name: Daily board update

on:
  schedule:
    - cron: '0 13 * * *'   # every day at 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pandas numpy scikit-learn trueskill pyarrow gdown tqdm

      - name: Cache Oracle's Elixir raw CSVs (for best-effort refresh)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: oe-raw-${{ github.run_id }}
          restore-keys: |
            oe-raw-

      - name: Download data snapshot from Release (reliable base)
        run: gh release download board-data --pattern board_input.parquet -D data --clobber

      - name: Best-effort incremental refresh (merge recent games; Drive is quota-limited in CI)
        continue-on-error: true
        run: python ml/refresh_snapshot.py --upload

      - name: Prepare input for the build (always from the snapshot)
        run: |
          mkdir -p data/processed
          cp -f data/board_input.parquet data/processed/oe_all.parquet

      - name: Build ratings and board data
        run: |
          python ml/build_drafts.py
          python ml/build_drafts_team.py
          python ml/build_board.py

      - name: Show summary
        run: cat web/public/data/meta.json

      - name: Deploy to gh-pages
        run: |
          cd web/public
          touch .nojekyll
          rm -rf .git
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Daily board update $(date -u +%F)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
